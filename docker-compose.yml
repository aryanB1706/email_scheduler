version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: email-scheduler-postgres
    restart: unless-stopped
    ports:
      - "5435:5432" # host 5435 avoids conflict with system postgres on 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: email-scheduler-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6380 avoids conflict with system redis on 6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
